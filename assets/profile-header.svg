    <circle cx="790" cy="140" r="1.5"/><circle cx="1080" cy="250" r="1.5"/><circle cx="700" cy="75" r="1.5"/>
  </g>
  <text x="78" y="137" fill="#ffffff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">BAT-VERSE</text>
