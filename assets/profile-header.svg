<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Bat-Verse</title>
  <desc id="desc">A bright, abstract banner for the Bat-Verse GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152f"/>
      <stop offset="0.55" stop-color="#22245a"/>
      <stop offset="1" stop-color="#552b82"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6be"/>
      <stop offset="0.52" stop-color="#70a5ff"/>
      <stop offset="1" stop-color="#d69bff"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#c6a0ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c6a0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1000" cy="75" r="210" fill="url(#orb)"/>
  <circle cx="1040" cy="160" r="90" fill="none" stroke="#b6a0ff" stroke-opacity=".28"/>
  <circle cx="1040" cy="160" r="135" fill="none" stroke="#b6a0ff" stroke-opacity=".18"/>
  <circle cx="1040" cy="160" r="180" fill="none" stroke="#b6a0ff" stroke-opacity=".12"/>
  <path d="M0 255 C190 200 300 310 500 245 S820 205 1200 250" fill="none" stroke="url(#glow)" stroke-opacity=".65" stroke-width="2"/>
  <path d="M0 275 C220 220 355 320 560 265 S900 220 1200 270" fill="none" stroke="url(#glow)" stroke-opacity=".3" stroke-width="1.5"/>
  <g fill="#d9d4ff" opacity=".8">
